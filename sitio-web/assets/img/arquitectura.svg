<svg viewBox="0 0 760 468" role="img" aria-labelledby="arq-titulo arq-desc"
     class="diagrama-arquitectura" xmlns="http://www.w3.org/2000/svg">
  <title id="arq-titulo">Qué sigue funcionando cuando se cae el internet</title>
  <desc id="arq-desc">
    Todo lo que hace falta para vender —la caja, las impresoras, la pantalla de cocina y una
    segunda caja— vive dentro del local y funciona sin conexión. La nube queda fuera de esa
    frontera, unida por una sola línea que se puede cortar.
  </desc>

  <style>
    .a-t-titulo { font: 600 15px 'Inter Tight', system-ui, sans-serif; fill: var(--ink, #16161A); }
    .a-t-sub    { font: 400 12.5px 'Inter Tight', system-ui, sans-serif; fill: var(--ink-3, #8E8E94); }
    .a-t-etq    { font: 600 10px 'JetBrains Mono', ui-monospace, monospace;
                  letter-spacing: .12em; fill: var(--ink-3, #8E8E94); }

    /* La frontera del local es la pieza que carga el argumento: lo de dentro no
       depende de lo de fuera. Por eso es lo único con relleno propio. */
    .a-local   { fill: var(--accent-soft, #EAF3FB); stroke: none; }
    .a-tarjeta { fill: var(--bg, #FFFFFF); stroke: var(--line-strong, #DDDDD9); stroke-width: 1; }
    .a-caja    { fill: var(--bg, #FFFFFF); stroke: var(--accent, #0078C9); stroke-width: 1.5; }
    .a-hilo    { stroke: var(--accent, #0078C9); stroke-width: 1.25; fill: none; opacity: .45; }

    /* Lo de fuera: gris, sin relleno y unido por puntos. Se lee como "opcional"
       antes de leer ninguna palabra. */
    .a-fuera   { fill: none; stroke: var(--line-strong, #DDDDD9); stroke-width: 1; }
    .a-enlace  { stroke: var(--ink-3, #8E8E94); stroke-width: 1.25; stroke-dasharray: 4 4; fill: none; }

    .a-corte { opacity: 0; }
    .a-nube-grupo, .a-enlace, .a-corte { transition: opacity 240ms cubic-bezier(0.23, 1, 0.32, 1); }

    .diagrama-arquitectura.sin-red .a-nube-grupo,
    .diagrama-arquitectura.sin-red .a-enlace { opacity: .3; }
    .diagrama-arquitectura.sin-red .a-corte  { opacity: 1; }

    @media (prefers-reduced-motion: reduce) {
      .a-nube-grupo, .a-enlace, .a-corte { transition: none; }
    }
  </style>

  <!-- ── Fuera del local ──────────────────────────────────────────────────
       Una tarjeta gris y vacía, no un dibujo de nube: el símbolo caricaturesco
       es justo lo que hacía que esto pareciera una lámina de manual. -->
  <g class="a-nube-grupo">
    <rect class="a-fuera" x="252" y="8" width="256" height="60" rx="8"/>
    <text class="a-t-etq" x="272" y="30">FUERA · OPCIONAL</text>
    <text class="a-t-sub" x="272" y="52">Respaldo, panel del dueño y reportes</text>
  </g>

  <!-- El único hilo que cruza la frontera. Y el corte. -->
  <path class="a-enlace" d="M380 68 L380 116"/>
  <g class="a-corte">
    <circle cx="380" cy="92" r="13" fill="var(--bg, #FFFFFF)"/>
    <path d="M374 86 L386 98 M386 86 L374 98"
          stroke="var(--danger, #C0392B)" stroke-width="2" stroke-linecap="round"/>
    <text class="a-t-etq" x="402" y="96" fill="var(--danger, #C0392B)">SE CAYÓ EL INTERNET</text>
  </g>

  <!-- ── Dentro del local ─────────────────────────────────────────────────
       Todo lo que hace falta para vender cabe aquí dentro. -->
  <rect class="a-local" x="16" y="116" width="728" height="336" rx="12"/>
  <text class="a-t-etq" x="40" y="146" fill="var(--accent-hover, #0063A8)">EN TU LOCAL</text>

  <!-- La caja, que es el centro -->
  <rect class="a-caja" x="230" y="166" width="300" height="86" rx="10"/>
  <text class="a-t-titulo" x="254" y="198">La caja</text>
  <text class="a-t-sub" x="254" y="220">Base de datos completa, aquí dentro.</text>
  <text class="a-t-sub" x="254" y="238">Cobra e imprime sin señal.</text>

  <!-- Del centro a cada pieza. Curvas suaves en vez de ángulos rectos: los
       ángulos rectos son lo que da aire de organigrama. -->
  <path class="a-hilo" d="M380 252 v28 q0 12 -12 12 H160 q-12 0 -12 12 v18"/>
  <path class="a-hilo" d="M380 252 v70"/>
  <path class="a-hilo" d="M380 252 v28 q0 12 12 12 H600 q12 0 12 12 v18"/>

  <!-- Las tres piezas, con el texto alineado a la izquierda como en una ficha,
       no centrado como en una caja de diagrama. -->
  <g>
    <rect class="a-tarjeta" x="48" y="340" width="200" height="80" rx="10"/>
    <text class="a-t-titulo" x="70" y="372">Cocina</text>
    <text class="a-t-sub" x="70" y="394">Comandas en pantalla</text>
  </g>
  <g>
    <rect class="a-tarjeta" x="280" y="340" width="200" height="80" rx="10"/>
    <text class="a-t-titulo" x="302" y="372">Impresoras</text>
    <text class="a-t-sub" x="302" y="394">Tickets y comandas por área</text>
  </g>
  <g>
    <rect class="a-tarjeta" x="512" y="340" width="200" height="80" rx="10"/>
    <text class="a-t-titulo" x="534" y="372">Segunda caja</text>
    <text class="a-t-sub" x="534" y="394">Comparte el mismo turno</text>
  </g>
</svg>
