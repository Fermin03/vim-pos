# F14 CN-013 (Cyber Neo) — gates de seguridad en CI.
# Cada PR a main corre: lint + typecheck + build + vitest + smokes de negocio + supabase
# db push/test (RLS) + pnpm audit. Si algo falla, el merge queda bloqueado. Previene que una
# regresión de seguridad (key filtrada, dep vulnerable, RLS roto) llegue a main sin que un
# humano la vea.
#
# 5/09/2026 — se sumaron los smokes de supabase/scripts/ al job `rls-tests`. Cubrían la
# operación completa en SQL desde hacía meses, pero no los corría nadie: `smoke_propina.sql`
# llevaba cinco semanas en rojo con el cobro con propina roto en producción. El detalle, en el
# propio paso. El job conserva el nombre `rls-tests` a propósito, porque puede estar marcado
# como check requerido en la protección de rama y renombrarlo lo desactivaría en silencio.
#
# SEC CN-015 — tres arreglos sobre la versión anterior:
#   1) El gate de dependencias terminaba en `|| true`, así que NUNCA bloqueaba nada. Se justificaba
#      con una crítica conocida de vitest, pero `--prod` ya excluye devDependencies: el `|| true`
#      no hacía falta ni para eso. Ahora bloquea de verdad (el árbol está en 0 vulnerabilidades).
#   2) Sin bloque `permissions`, el GITHUB_TOKEN heredaba el default del repositorio. Ahora es
#      read-only y explícito.
#   3) Las acciones iban por tag (`@v4`), que es mutable: quien controle el repo de la acción puede
#      reapuntarlo. Ahora van pinneadas al SHA del commit, con el tag en el comentario.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Mínimo privilegio: ningún job de este workflow escribe en el repo.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, no 20: @supabase/realtime-js exige WebSocket NATIVO, que llega en Node 22. Con 20
          # los tests de admin fallan al importar app/lib/supabase.ts ("Node.js 20 detected without
          # native WebSocket support"), porque createClient() corre al cargar el módulo. No se ve en
          # local si ahí se usa Node 22+; se destapó al actualizar dependencias (CN-009).
          node-version: "22"
          cache: pnpm

      - name: Install (frozen lockfile)
        # --frozen-lockfile = misma resolución exacta que el lockfile committed.
        # Si alguien sube un package.json desincronizado del lockfile, falla aquí.
        run: pnpm install --frozen-lockfile

      - name: Escala tipográfica
        # Falla si alguien escribe un `text-[Npx]` fuera de la escala del preset (scripts/tipografia.mjs).
        run: pnpm tipografia

      - name: Typecheck apps
        # Solo apps/* tienen el script typecheck; packages se construyen con tsc al ser
        # importados desde las apps (transpilePackages en next.config).
        run: pnpm --filter "./apps/*" -r typecheck

      - name: Build (apps Next.js)
        # Variables públicas requeridas por Next al hacer build. Valores dummy: el build
        # no las consume en runtime de CI.
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy
        run: pnpm -r build

      - name: Vitest (POS + Admin)
        # `pnpm -r test` ejecuta el script `test` de cada paquete que lo define (pos, admin,
        # platform…).
        # Pendiente (docs/bitacora/2026-08-remediacion.md Fase 6): montar ESLint (hoy ninguna app lo tiene
        # configurado, `next lint` es interactivo).
        run: pnpm -r test

      - name: Pruebas del sitio web
        # 45+ pruebas que protegen el middleware, las cabeceras de seguridad (CSP igual en
        # vercel.json, middleware.ts y .htaccess), el 404 y el sitemap. Existían y el CI no las
        # corría. Node pelado, sin dependencias. Auditoría integral 30/09/2026, E-5a.
        run: pnpm test:sitio

      - name: Pruebas de las Edge Functions
        # supabase/functions es código Deno y no está en el workspace de pnpm, así que sus
        # módulos puros se prueban con el runner de Node (--experimental-strip-types, 22.6+).
        # No dependen de node_modules: solo de `node:` y de sus propios archivos.
        #
        # 9/09/2026 — se sumaron aquí y en el job `desktop`. Existían desde hacía meses y el CI
        # no las corría: el gate del escritorio era `node --check`, que comprueba que el archivo
        # PARSEA y nada más. Una regresión en el ciclo de sync, en el espejo de pedidos o en el
        # cálculo de un delta pasaba el CI entera sin que nadie la viera.
        run: pnpm test:functions

      - name: Auditoría de dependencias — BLOQUEANTE (lo que se despliega)
        # Sin `|| true`: si una dependencia de producción tiene una CVE alta, el merge se detiene.
        run: pnpm audit --prod --audit-level=high

      - name: Auditoría completa — informativa (incluye dev)
        # Las de desarrollo no viajan al cliente, así que no bloquean el merge; pero se
        # imprimen para que no pasen desapercibidas. Si alguna afecta al build (por ejemplo la
        # cadena de electron-builder, que sí produce el instalador), súbela al paso bloqueante.
        run: pnpm audit || true

  desktop:
    # SEC CN-015 — el CI no cubría desktop/, que es justo donde vivían los hallazgos de mayor
    # impacto (secreto JWT, gateway en la LAN, actualizador). Cobertura mínima: que las deps de
    # producción estén limpias y que las fuentes parseen. Los verify:* de extremo a extremo
    # necesitan el Postgres embebido de Windows y quedan fuera de este job a propósito.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # El Node que empaqueta Electron, a propósito: `node --check` y `node --test` comprueban
          # las fuentes contra la versión que de verdad las va a ejecutar en la caja del cliente.
          # Electron 43 trae Node 24 (DEPS de electron/electron: v43.0.0 → v24.17.0,
          # v43.4.0 → v24.18.1). Antes decía "20 = Electron 33", que dejó de ser cierto al subir
          # Electron; al volver a subirlo de mayor, revisa `node_version` en su DEPS y ajusta esto.
          node-version: "24"

      - name: Auditoría de deps de producción del escritorio
        # npm audit lee package-lock.json: no hace falta instalar (electron y el Postgres
        # embebido son pesados y específicos de plataforma).
        working-directory: desktop
        run: npm audit --omit=dev --audit-level=high

      - name: Auditoría de Electron — BLOQUEANTE
        # `--omit=dev` de arriba deja fuera a electron porque en package.json es devDependency
        # (así lo pide electron-builder), pero su binario —Chromium + Node— VA DENTRO del
        # instalador y es lo que corre en la caja. Una CVE alta de Electron tiene que detener el
        # merge igual que la de pg. Se filtra solo `electron`: el resto de la cadena de
        # electron-builder (xmldom, js-yaml…) produce el instalador pero no viaja en él, y queda
        # en el paso informativo de abajo. Auditoría integral 30/09/2026, hallazgo E-5c.
        working-directory: desktop
        run: |
          npm audit --json > /tmp/audit-desktop.json || true
          node -e '
            const a = require("/tmp/audit-desktop.json");
            const v = (a.vulnerabilities || {}).electron;
            if (v && ["high", "critical"].includes(v.severity)) {
              const avisos = v.via.filter((x) => typeof x === "object").map((x) => `  - ${x.title} (${x.url})`);
              console.error(`❌ electron ${v.range}: vulnerabilidad ${v.severity}\n${avisos.join("\n")}`);
              process.exit(1);
            }
            console.log("✅ electron sin vulnerabilidades altas");
          '

      - name: Auditoría completa del escritorio — informativa (cadena de electron-builder)
        working-directory: desktop
        run: npm audit || true

      - name: Las fuentes parsean
        working-directory: desktop
        run: node --check src/main.mjs && for f in src/*.mjs scripts/*.mjs; do node --check "$f"; done

      - name: Dependencias mínimas para las pruebas
        # Solo las tres de producción (pg, embedded-postgres, jsonwebtoken) y sin postinstall.
        # electron y electron-builder son devDependencies: pesan cientos de megas y `node --test`
        # no los toca. Comprobado: con esto las 85 pruebas corren enteras.
        working-directory: desktop
        run: npm ci --omit=dev --ignore-scripts

      - name: Pruebas del escritorio
        # Corren sobre el mismo Node 24 del paso anterior a propósito: es el que empaqueta
        # Electron, así que se prueban contra la versión que de verdad las va a ejecutar en la
        # caja del cliente. Los verify:* de extremo a extremo siguen fuera: necesitan el Postgres
        # embebido de Windows.
        working-directory: desktop
        run: node --test src/*.test.mjs

  rls-tests:
    # Sin `services: postgres`: había un postgres:15 que ningún paso usaba (`supabase start`
    # levanta su propio Postgres en Docker y todo se conecta por el DB_URL de `supabase status`).
    # Solo gastaba arranque y ocupaba el 5432 del runner. Auditoría integral 30/09/2026, E-5d.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Versión fija en vez de `latest`: un CI reproducible no debe cambiar de herramienta
          # sola. Súbela a conciencia cuando haga falta.
          version: 2.114.0

      - name: Start Supabase local stack
        run: supabase start

      - name: Smokes de negocio (supabase/scripts/smoke_*.sql) — BLOQUEANTE
        # POR QUÉ EXISTE ESTE PASO.
        #
        # Los smokes de supabase/scripts/ cubren la operación de punta a punta en SQL —venta,
        # cobro, propina, mesas, cancelación, devolución, corte, sync— y hasta el 5/09/2026 NO LOS
        # CORRÍA NADA. `smoke_propina.sql` estuvo CINCO SEMANAS en rojo sin que nadie se enterara:
        # la migración 0060 había perdido el `+ propina_mxn` del guard de sobrepago, así que todo
        # cobro con propina se rechazaba, el ticket se quedaba ABIERTO y la mesa nunca se liberaba.
        # El smoke que lo cazaba existía desde antes del bug. El agujero no fue de cobertura: fue
        # que la cobertura no se ejecutaba. Ver la migración 0102.
        #
        # Van aquí y no en un job propio porque este ya tiene el stack levantado con las
        # migraciones y el seed aplicados, que es exactamente lo que necesitan. Un job aparte
        # volvería a levantar Docker para nada.
        #
        # Se corren con psql y no con `desktop/scripts/smokes.mjs`: los .sql ya traen su
        # `\set ON_ERROR_STOP on` y su `BEGIN;/ROLLBACK;`, que psql entiende de forma nativa. El
        # runner de Node existe para correrlos en local sin Docker (`npm run smokes` en desktop/).
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL="\{0,1\}\([^"]*\)"\{0,1\}$/\1/p')"
          if [ -z "$DB_URL" ]; then
            echo "❌ no pude sacar DB_URL de 'supabase status -o env'"; exit 1
          fi

          # Sin el fixture no hay nada que probar y los 34 fallarían con errores que no orientan
          # a nada. Mejor una línea que diga la verdad: el seed no entró.
          if ! psql "$DB_URL" -tAc "SELECT 1 FROM tenants WHERE id='99999999-0000-0000-0000-0000000000aa'" | grep -q 1; then
            echo "❌ el fixture de supabase/seed.sql no está en la BD; los smokes lo necesitan"; exit 1
          fi

          # Se corren TODOS y se acumulan los fallos: un PR rojo debe decir cuáles smokes se
          # rompieron, no solo el primero.
          fallos=0
          for f in supabase/scripts/smoke_*.sql; do
            if psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f" >/tmp/smoke.out 2>&1; then
              echo "✅ $(basename "$f")"
            else
              fallos=$((fallos + 1))
              echo "❌ $(basename "$f")"
              # Los RAISE NOTICE del smoke dicen en qué paso murió; salen por stderr.
              sed 's/^/      /' /tmp/smoke.out
            fi
          done

          echo
          if [ "$fallos" -ne 0 ]; then
            echo "❌ $fallos smoke(s) en rojo"; exit 1
          fi
          echo "✅ todos los smokes en verde"

      - name: Apply migrations + run RLS tests
        # `supabase test db` corre supabase/tests/*.sql como pg_prove:
        #   0001 — smoke RLS cross-tenant: un tenant NO puede leer datos de otro.
        #   0002 — cobertura: toda tabla con tenant_id tiene RLS y política.
        #   0003 — SEC CN-002: ninguna RPC exclusiva de service_role es ejecutable por
        #          authenticated/anon (atrapa la reincidencia del GRANT masivo de la 0045).
        run: supabase test db

      - name: Stop Supabase local stack
        if: always()
        run: supabase stop
