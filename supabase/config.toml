# Supabase local config — VIM POS
# Doc de referencia: 07-1A (BD), 07-1F (auth hook).

project_id = "vim-pos"

[db]
major_version = 15

[auth]
enable_signup = true
# El POS usa PIN (Edge Function pin-login, doc 1F §5); el admin usa email+password.

# Custom Access Token Hook — inyecta tenant_id y tipo_identidad en el JWT (doc 1F §3).
# Es el cimiento del que depende TODO el RLS.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# Segundo factor por app autenticadora: lo exige el panel de plataforma a cada operador (ADR 0019).
# En los proyectos de Supabase en la nube viene encendido; en local hay que pedirlo.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[realtime]
enabled = true

[storage]
enabled = true
# Buckets: cfdi-xml, cfdi-pdf, logos (se crean en migración correspondiente).

# Edge Functions pre-auth (se invocan SIN JWT de usuario): el gateway no debe exigir JWT.
# Validan su propia autorización (PIN de dispositivo / clave de provisioning / signup público).
[functions.pin-login]
verify_jwt = false

[functions.signup-tenant]
verify_jwt = false

[functions.provisionar-tenant]
verify_jwt = false

[functions.solicitar-demo]
verify_jwt = false

# Portal público de autofactura: lo llama un comensal sin sesión con la llave publicable
# (sb_publishable_…), que NO es un JWT. Faltaba aquí y un `functions deploy` sin
# `--no-verify-jwt` lo dejó respondiendo "Invalid JWT" en producción (25 sep 2026).
[functions.autofacturar]
verify_jwt = false

# La llama el servidor de la tienda en línea, no el navegador: se autentica con el secreto
# x-vim-tienda, no con un JWT. Sin esto el gateway responde "Invalid JWT" antes de llegar.
[functions.tienda]
verify_jwt = false

# Webhook de Uber Eats (ADR 0011): sin JWT, la autenticidad la da X-Uber-Signature.
[functions.delivery-webhook-uber]
verify_jwt = false

# enviar-push valida por sí misma (JWT de usuario o secreto interno x-vim-interno para el camino
# base de datos → pg_net, mig. 0097); la verificación del gateway rechazaría la llamada interna.
[functions.cargar-csd]
# La función valida el JWT del usuario por sí misma (getUser) y acepta además el camino interno
# `x-vim-interno` (verificar cuenta del PAC), que no trae JWT.
verify_jwt = false

[functions.enviar-push]
verify_jwt = false
